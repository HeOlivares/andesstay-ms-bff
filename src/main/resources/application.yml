server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: andesstay-ms-bff

andesstay:
  # Nombres oficiales (andesstay-infra/apps/compose.yml). Fallback a *_BASE_URL por compatibilidad local.
  catalog-base-url: ${MS_CATALOG_URL:${CATALOG_BASE_URL:http://localhost:8081}}
  reservations-base-url: ${MS_RESERVATIONS_URL:${RESERVATIONS_BASE_URL:http://localhost:8082}}
  security:
    # azure = IDaaS (default demo). local = HMAC solo para pruebas offline.
    mode: ${SECURITY_MODE:azure}
    jwt:
      local-secret: ${JWT_LOCAL_SECRET:andesstay-local-dev-secret-change-me-32b}
      # App ID URI; el validador también acepta el Client ID sin prefijo api://
      audience: ${AZURE_AUDIENCE:api://4cd6df9a-e2f7-4024-aea6-dd67c49709bc}
      issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/cb0b9f53-0ba7-4f09-8da2-c2f5ab4b73ee/v2.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
